name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.crates.outputs.test }}
      check: ${{ steps.crates.outputs.check }}
      desktop: ${{ steps.desktop.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Changed codegen crates
        id: crates
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test=$(.github/scripts/changed-codegen-crates.sh "$BASE")
          # Workspace-wide inputs, and the CI itself, can break any crate: check
          # them all. Testing them all takes hours, so tests stay per crate.
          if git diff --name-only "$BASE...HEAD" |
            grep -qxE 'Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.github/workflows/ci\.yml|\.github/scripts/changed-codegen-crates\.sh'; then
            check=$(.github/scripts/changed-codegen-crates.sh --all)
          else
            check=$test
          fi
          echo "Check:"; echo "${check:-(none)}"
          echo "Test:"; echo "${test:-(none)}"
          echo "check=$(echo $check)" >> "$GITHUB_OUTPUT"
          echo "test=$(echo $test)" >> "$GITHUB_OUTPUT"
      - name: Desktop changes
        id: desktop
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE...HEAD" | grep -qE '^(desktop/macOS/|third_party/SwiftTerm/|\.github/workflows/ci\.yml$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (changed codegen crates)
    needs: changes
    if: needs.changes.outputs.check != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Debug info roughly doubles the test build; the runner's disk can't hold it.
      CARGO_PROFILE_DEV_DEBUG: 0
      PROTOC: /usr/bin/protoc
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        env:
          CRATES: ${{ needs.changes.outputs.check }}
        run: cargo check --locked --all-targets $(printf -- '-p %s ' $CRATES)
      - name: cargo test
        if: needs.changes.outputs.test != ''
        env:
          CRATES: ${{ needs.changes.outputs.test }}
        run: cargo test --locked --no-fail-fast $(printf -- '-p %s ' $CRATES)

  swift:
    name: Swift (desktop/macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # Xcode 26 (Swift 6.2), the toolchain the desktop app is developed with.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/macOS
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - name: swift test
        run: swift test
