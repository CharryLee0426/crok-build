# Compiles every client before a pull request can merge into main: the crok TUI, Crok Desktop against
# the macOS 26 and macOS 15 SDKs (the two release images), the iOS app and the Android app.
#
# Branch protection (.github/rulesets/protect-main.json) requires one check, "All builds" (the last job),
# so jobs can be added, renamed or split without touching the ruleset. See "Continuous integration" in
# README.md.
name: CI

on:
  pull_request:
    branches: [main]
  # Runs on main keep the caches warm: a pull request reads the caches its base branch saved.
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tui:
    name: TUI
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      # A one-off build gains nothing from incremental state or debug info, and both cost disk and time.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        # With no name, rustup installs the toolchain rust-toolchain.toml pins.
        run: |
          rustup toolchain install
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install DotSlash
        # The proto build scripts run bin/protoc, a DotSlash file that fetches the pinned protoc
        # (README.md, "Building from source").
        env:
          DOTSLASH_VERSION: v0.5.9
          DOTSLASH_SHA256: eef15be1b554de7b1409cb0c69c24f2cd04f19c0f101ad69fcdf9d66d4d51639
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dotslash.tar.gz" \
            "https://github.com/facebook/dotslash/releases/download/$DOTSLASH_VERSION/dotslash-macos-arm64.$DOTSLASH_VERSION.tar.gz"
          echo "$DOTSLASH_SHA256  $RUNNER_TEMP/dotslash.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/dotslash.tar.gz" -C "$RUNNER_TEMP/bin" dotslash
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bin:$PATH" bin/protoc --version

      - name: Build crok
        # A debug build compiles and links the same crates as `make build` without downloading the
        # ripgrep and fd that release builds bundle. --locked fails when Cargo.lock is out of date.
        run: cargo build --locked -p xai-grok-pager-bin

  desktop:
    name: Desktop (macOS ${{ matrix.sdk }} SDK)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: "26"
            runner: macos-26
          # Only the macOS 15 image has a macOS 15 SDK (in its Xcode 16).
          - sdk: "15"
            runner: macos-15
    env:
      SDK: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26 and the macOS ${{ matrix.sdk }} SDK
        # Releases compile with a Swift 6.2 or later toolchain against each SDK (release/publish.sh).
        # The macOS 15 SDK build only compiles while Liquid Glass stays behind
        # `canImport(SwiftUI, _version: 7)`, which is what this leg checks.
        run: .github/scripts/select-xcode.sh "$SDK"

      - name: Build Crok Desktop
        # The same build as desktop/macOS/scripts/build-app.sh. The native build system is the one that
        # honours SDKROOT; Swift Build compiles against the toolchain's own SDK whatever SDKROOT says.
        run: |
          swift --version
          swift build --package-path desktop/macOS --configuration release --build-system native

      - name: Check the SDK it was built against
        run: |
          bin="$(swift build --package-path desktop/macOS --configuration release --build-system native --show-bin-path)"
          linked="$(otool -l "$bin/GrokDesktop" | awk '/LC_BUILD_VERSION/ {f=1} f && /sdk/ {print $2; exit}')"
          echo "GrokDesktop is linked against the macOS $linked SDK"
          case "$SDK:$linked" in
            26:26.*|15:15.*) ;;
            *) echo "::error::Expected the macOS $SDK SDK, got $linked"; exit 1 ;;
          esac

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: .github/scripts/select-xcode.sh

      - name: Build Crok for iOS
        # Built for devices, unsigned: ConvexMobile has no x86_64 simulator slice, and signing needs a team.
        # Package versions come from the committed Package.resolved only.
        run: |
          xcodebuild -version
          xcodebuild build \
            -project mobile/iOS/Crok.xcodeproj \
            -scheme Crok \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/Android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle and validates the committed wrapper jar. The runner image's Android SDK
      # (ANDROID_HOME) has the platform and build tools the build needs, or AGP downloads them.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Crok for Android
        run: ./gradlew :app:assembleDebug

  # The one required check. It fails unless every build above succeeded, so a failed, skipped or
  # cancelled build cannot pass for a green one.
  all-builds:
    name: All builds
    if: ${{ !cancelled() }}
    needs: [tui, desktop, ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every build passed
        env:
          TUI: ${{ needs.tui.result }}
          DESKTOP: ${{ needs.desktop.result }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          status=0
          for job in TUI DESKTOP IOS ANDROID; do
            echo "$job: ${!job}"
            [[ "${!job}" == success ]] || status=1
          done
          exit "$status"
