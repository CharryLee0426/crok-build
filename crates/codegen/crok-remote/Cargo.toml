[package]
name = "crok-remote"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Remote control for crok: signs this computer in to the relay and carries its sessions and commands"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
convex = { version = "0.10.4", default-features = false, features = ["rustls-tls-native-roots"] }
futures = { workspace = true }
gethostname = { workspace = true }
qrcode = { version = "0.14.1", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
webbrowser = { workspace = true }
xai-dirs = { workspace = true }
xai-grok-extra-ca = { workspace = true }
xai-grok-i18n = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
