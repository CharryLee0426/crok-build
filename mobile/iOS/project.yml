# XcodeGen spec for the Crok iOS app. Regenerate Crok.xcodeproj after changing it:
#
#   xcodegen generate --spec project.yml      (run in mobile/iOS; see README.md)
#
# The generated project is committed so the app opens in Xcode without XcodeGen installed.
name: Crok
options:
  bundleIdPrefix: dev.chenli.crok
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: "0.8.1"
  # Replies in Markdown (relay/DESIGN.md §5): cmark-gfm parsing and native LaTeX math.
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    exactVersion: "0.9.0"
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: "1.7.3"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Crok:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Crok
    dependencies:
      - package: ConvexMobile
        product: ConvexMobile
      - package: Markdown
        product: Markdown
      - package: SwiftMath
        product: SwiftMath
    info:
      path: Crok/Info.plist
      properties:
        CFBundleDisplayName: Crok
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans, ja, es, fr, de]
        CFBundleURLTypes:
          - CFBundleURLName: dev.chenli.crok.mobile
            CFBundleURLSchemes: [crok]
        CrokRelayURL: $(CROK_RELAY_URL)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Crok uses the camera to scan the QR code that crok remote login shows on your computer.
        NSLocalNetworkUsageDescription: Crok uses your local network only when a development build points it at a relay there.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Crok
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenli.crok.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

  CrokTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CrokTests
    dependencies:
      - target: Crok
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenli.crok.mobile.tests

  CrokUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CrokUITests
    dependencies:
      - target: Crok
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenli.crok.mobile.uitests
        TEST_TARGET_NAME: Crok

schemes:
  Crok:
    build:
      targets:
        Crok: all
        CrokTests: [test]
        CrokUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CrokTests
        - CrokUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
