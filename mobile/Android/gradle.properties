org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The relay (Convex deployment URL) the app signs in to, e.g. https://<deployment>.convex.cloud. When empty, debug builds
# use http://10.0.2.2:3210 (the emulator's alias for the host's `npx convex dev`) and release builds have none, so the
# Welcome screen asks for a server. Override per build with -PcrokRelayUrl=…
crokRelayUrl=
