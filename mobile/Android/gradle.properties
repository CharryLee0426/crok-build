# Development only: another relay (Convex deployment URL) to sign in to, e.g. http://10.0.2.2:3210 for the emulator's
# view of the host's `npx convex dev`. When empty, every build uses the built-in relay (app/build.gradle.kts). Nobody
# types a relay address in the app. Override per build with -PcrokRelayUrl=…
crokRelayUrl=
