org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The relay environment (relay/environments/<env>.env) every build type signs in to: prod or dev. When empty, debug
# builds use dev and release builds prod (app/build.gradle.kts). Override per build with -PcrokRelayEnv=…
crokRelayEnv=

# Development only: another relay (Convex deployment URL) to sign in to, e.g. http://10.0.2.2:3210 for the emulator's
# view of the host's `npx convex dev`. It wins over crokRelayEnv. Nobody types a relay address in the app. Override per
# build with -PcrokRelayUrl=…
crokRelayUrl=
